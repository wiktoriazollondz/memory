<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="auth-section">
      <h2>Memory Game</h2>
      <form class="loginForm" onsubmit="event.preventDefault()">
        <input type="text" id="username" placeholder="Login" />
        <input type="password" id="password" placeholder="Hasło" />
        <button type="button" onclick="login()">Zaloguj się</button>
        <button type="button" onclick="register()">Zarejestruj się</button>
      </form>
    </div>

    <div id="menu-section" style="display: none">
      <div class="user-header">
        Zalogowany jako: <strong id="logged-user-display"></strong>
        <button onclick="logout()" class="small-btn">Wyloguj się</button>
        <button id="delete" class="small-btn" onclick="deleteAccount()">Usuń konto</button>  
      </div>

      <div class="menu-container">
        <button class="big-btn1" onclick="startSinglePlayer()">
          Graj Singleplayer (na czas)
        </button>
        <button class="big-btn2" onclick="startMultiPlayer()">
          Graj Multiplayer (pojedynki)
        </button>
      </div>
    </div>

    <div id="game-section" style="display: none">
      <div class="optionButtons">
        <div class="button-group">
          <button
            id="back-button"
            onclick="backToMenu()"
            style="display: inline-block"
          >
            Powrót do menu
          </button>
          <button onclick="openHistory()" class="history-btn">Historia gier</button>
          <button onclick="logout()">Wyloguj się</button> 

          <div id="history-modal" class="modal-overlay">
            <div class="modal-content">
              <span class="close-modal" onclick="closeHistory()">&times;</span>
              <h3>Twoja historia gier</h3>
              <div class="history-table-container">
                <table class="history-table">
                  <thead>
                    <tr>
                      <th>Data</th>
                      <th>Wynik</th>
                      <th>Notatka</th>
                      <th>Akcje</th>
                    </tr>
                  </thead>
                  <tbody id="history-list">
                    </tbody>
                </table>
              </div>
            </div>
          </div>

        <div class="player-info-box">
          <span id="game-user-display"></span><br />
          <strong id="room-display"></strong>
        </div>
      </div>

      <div id="game-info">
        <p>
          <span id="timer-container" style="display: none"
            >Czas: <span id="timer">0</span>s</span
          >
          <span id="turn-info" style="display: none">Oczekiwanie...</span>
        </p>
      </div>

      <div class="page-layout">
        <div id="board" class="board"></div>

        <div id="chat-container" class="chat">
          <h3>Czat</h3>
          <input type="text" id="comment-input" placeholder="Napisz coś..." />
          <button type="button" onclick="addComment(event)">Wyślij</button>
          <ul id="comments-list"></ul>
        </div>

        <div id="leaderboard-container" class="leaderboard">
          <h3>Tablica wyników</h3>
          <input
            type="text"
            id="search-input"
            placeholder="Wyszukaj gracza..."
            onkeyup="searchPlayers()"
          />
          <ul id="leaderboard-list"></ul>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
