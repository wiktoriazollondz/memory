apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memory-game-ingress
  namespace: memory-game
  annotations:
    # używamy standardowego kontrolera Ingress opartego na NGINX
    kubernetes.io/ingress.class: "nginx"
    # WebSockets i ciasteczka
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # automatyczne przepisywanie ścieżek, jeśli backend nie spodziewa się prefiksu /api
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # główna strona - przekieruj ruch do Frontendu
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: memory-frontend-service
                port:
                  number: 80

          # zapytania HTTP CRUD - przekieruj ruch do Backend API
          - path: /api(/(.*))
            pathType: ImplementationSpecific
            backend:
              service:
                name: memory-backend-service
                port:
                  number: 3000

          # synchronizacja pokoi i rozgrywki (Socket.io / WebSockets)
          - path: /socket.io(/(.*))
            pathType: ImplementationSpecific
            backend:
              service:
                name: memory-backend-service
                port:
                  number: 3000