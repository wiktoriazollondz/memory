apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logto-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: logto-db-service
spec:
  selector:
    app: logto-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logto-db
spec:
  serviceName: "logto-db-service"
  replicas: 1
  selector:
    matchLabels:
      app: logto-db
  template:
    metadata:
      labels:
        app: logto-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          envFrom:
            - secretRef:
                name: logto-secrets
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: logto-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: logto-db-data
          persistentVolumeClaim:
            claimName: logto-db-pvc
