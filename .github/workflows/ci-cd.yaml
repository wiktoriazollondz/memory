name: CI/CD Pipeline - Memory Game

on:
  push:
    branches: [ main ]

jobs:
  build-publish-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # pobranie kodu z repo
      - name: Checkout code
        uses: actions/checkout@v4

      # logowanie do darmowego rejestru obrazów na GitHubie (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # budowanie obrazów i publikacja do rejestru
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/memory-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/memory-frontend:latest

      # uruchomienie wirtualnego klastra Kubernetes (Kind) w chmurze GitHuba
      - name: Create Kubernetes local cluster (Kind)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-cluster

      # namespace, żeby Kustomize miał gdzie wejść
      - name: Create Namespace
        run: |
          kubectl create namespace memory-game

      # wykonanie deploy przez Kustomize
      - name: Deploy to Kind Cluster via Kustomize
        run: |
          kubectl apply -k k8s/overlays/dev

      # sprawdza rollout
      - name: Verify Backend Rollout Status
        run: |
          kubectl rollout status deployment/memory-backend-dev -n memory-game --timeout=90s